<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Eugen Liske</title>
    
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/hero_section.css">
</head>
<body>
    <section class="hero-section">
        <div class="hero-content">
            <div class="hero-img-wrapper">
                <img class="bg-shape-default" src="./assets/icons/hero_picture_bg_shape_default.svg">
                <img class="bg-shape-hover" src="./assets/icons/hero_picture_bg_shape_hover.svg">
                <img class="hero-img" src="./assets/img/hero_section_picture_chatgpt_test.png" alt="picture-of-eugen-liske">
            </div>

            <div class="hero-information-wrapper">
                <div class="hero-icon-area">
                    <div class="hero-main-logo">
                        <div class="logo-wrapper">
                            <img class="portfolio-logo-default" src="./assets/icons/portfolio_logo_default.svg" alt="portfolio_logo_default">
                            <img class="portfolio-logo-hover" src="./assets/icons/portfolio_logo_hover.svg" alt="portfolio_logo_hover">
                        </div>
                        
                        <span class="logo-name">E.Liske</span>
                        <span class="logo-title">developer</span>
                    </div>

                    <div class="hero-social-media-icons">
                        <div class="social-media-icon-wrapper">
                            <img class="social-media-icon-default" src="./assets/icons/mail_icon_default.svg">
                            <img class="social-media-icon-hover" src="./assets/icons/mail_icon_hover.svg">
                        </div>

                        <div class="social-media-icon-wrapper">
                            <img class="social-media-icon-default" src="./assets/icons/github_icon_default.svg">
                            <img class="social-media-icon-hover" src="./assets/icons/github_icon_hover.svg">
                        </div>

                        <div class="social-media-icon-wrapper">
                            <img class="social-media-icon-default" src="./assets/icons/linkedin_icon_default.svg">
                            <img class="social-media-icon-hover" src="./assets/icons/linkedin_icon_hover.svg">
                        </div>
                    </div>
                </div>

                <h1>
                    Eugen Liske
                </h1>

                <h2>
                    FRONTEND ENTWICKLER
                </h2>

                <a href="#why-me-section-ID" class="nav-arrow-position-wrapper">
                    <div class="nav-arrow-wrapper">
                        <img class="nav-arrow-down-default" src="./assets/icons/hero_section_arrow_down_icon_default.svg" alt="hero_section_arrow_down_icon_default">
                        <img class="nav-arrow-down-hover" src="./assets/icons/hero_section_arrow_down_icon_hover.svg" alt="hero_section_arrow_down_icon_hover">
                    </div>
                </a>
            </div>
        </div>
    </section>

    <div class="header-wrapper">
        <header>
            <div class="hero-main-logo">
                <img src="./assets/icons/portfolio_logo_dark.svg" alt="portfolio_logo_dark">
                <span class="logo-name">E.Liske</span>
                <span class="nav-logo-title">developer</span>
            </div>

            <nav class="nav-link-wrapper">
                <a href="#why-me-section-ID" class="nav-link">Why me</a>
                <a href="" class="nav-link">Skills</a>
                <a href="" class="nav-link">Projects</a>
                <a href="" class="nav-link">Contact</a>
            </nav>

            <div class="nav-translate-function">
                <span>DE</span>
                <span>EN</span>
            </div>
        </header>
    </div>

    <main class="test-div">
        <section class="why-me-section" id="why-me-section-ID"></section>
    </main>
</body>
</html>
